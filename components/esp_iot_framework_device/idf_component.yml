name: "esp_iot_framework_device"
description: "A framework for creating reliable IoT devices based on the Espressif Systems devices"
version: "0.1.1"
license: "Apache-2.0"
targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c2
  - esp32c3
  - esp32c6
dependencies:
  idf: ">=4.4.0"
  espressif/cjson:
    version: "^3.2.1"
    rules:
      - if: "idf_version >= 6.0.0"