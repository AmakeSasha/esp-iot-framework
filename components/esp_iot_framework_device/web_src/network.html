<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Network Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="referrer" content="no-referrer">
  <script type="text/javascript" src="/_/files/json2.js"></script>
  <script type="text/javascript" src="/_/files/api.js"></script>
  <link rel="stylesheet" type="text/css" href="/_/files/style.css">
  <style>
    [data-state="view"] [id^="btnShow"], 
    [data-state="view"] [id^="btnTest"] { 
      display: inline-block !important; 
    }
    [data-state="view"] [id^="passRow"], 
    [data-state="view"] [id^="btnSave"], 
    [data-state="view"] [id^="btnHide"], 
    [data-state="view"] [id^="btnClear"] { 
      display: none !important; 
    }

    [data-state="editing"] { 
      background-color: olive !important; 
    }
    [data-state="editing"] [id^="passRow"] { 
      display: block !important; 
    }
    [data-state="editing"] [id^="btnShow"], 
    [data-state="editing"] [id^="btnTest"] { 
      display: none !important; 
    }
    [data-state="editing"] [id^="btnSave"], 
    [data-state="editing"] [id^="btnHide"], 
    [data-state="editing"] [id^="btnClear"] {
      display: inline-block !important; 
    }

    [data-state="wait"]  { 
      background-color: yellow; 
      color: red; 
    }
    [data-state="error"] { 
      background-color: red !important; 
    }
    [data-state="stop"]  { 
      background-color: grey; 
    }

    #btnShow0 { display: none !important; }
    #passRow0 { display: block !important; }
    #btnTest0 { width: 100% !important; display: block !important; }
  </style>
</head>
<body>
  <div class="window">
    <div class="title">📶 WiFi Settings</div>
    <div id="cards-container"></div>
    
    <div class="card" id="cardTemplate" style="display: none" data-state="view">
      <div class="slot" id="slotTitleSLOT_ID">SLOT_LABEL</div>

      <div class="row">
        <span class="label">SSID:</span> 
        <input id="ssidSLOT_ID" maxlength="31" readonly="">
      </div>      
      <div class="row" id="passRowSLOT_ID">
        <span class="label">Pass:</span>
        <input type="password" id="passSLOT_ID" maxlength="63">
      </div>
      <div style="width: 100%; overflow: hidden; margin-top: 10px;">
        <!-- (editing) -->
        <button onclick="saveNetwork(SLOT_ID)" id="btnSaveSLOT_ID" style="width:40%; float:left; margin-right:2%;">💾 Save</button>
        <button onclick="statusCard(SLOT_ID, false)" id="btnHideSLOT_ID" style="width:40%; float:left; margin-right:2%;">❌ Cancel</button>
        <button onclick="clearCard(SLOT_ID)" id="btnClearSLOT_ID" style="width:16%; float:left;">🧹 Clear</button>
        <!-- (view) -->
        <button onclick="statusCard(SLOT_ID, true)" id="btnShowSLOT_ID" style="width:49%; float:left; margin-right:2%;">🔄 Change</button>
        <button onclick="testNetwork(SLOT_ID, true)" id="btnTestSLOT_ID" style="width:49%; float:left;">📶 Test</button>
      </div>
    </div>
  </div>
  <script language="JavaScript">
    var wifiNetworks = [];
    var countTestButtons = 0;

    API.getProfiles =   function(cb)    { API._sendJson("GET",  "/_/wifi/list.json",   null, cb); };
    API.getResult =     function(cb, d) { API._sendJson("POST", "/_/wifi/result.json",    d, cb); };
    API.updateProfile = function(cb, d) { API._sendJson("POST", "/_/wifi/update.do",      d, cb); };
    API.clearProfile =  function(cb, d) { API._sendJson("POST", "/_/wifi/clear.do",       d, cb); };
    API.checkProfile =  function(cb, d) { API._sendJson("POST", "/_/wifi/check.do",       d, cb); };

    /* API */
    function saveNetwork(slot) {
      var btn = document.getElementById('btnSave' + slot);
      var ssid = document.getElementById('ssid' + slot).value;
      var pass = document.getElementById('pass' + slot).value;

      if (ssid.length < 1) return alert("SSID too short!");
      if (pass.length < 8) return alert("Password too short!");

      if (!confirm('Are you sure you want to overwrite the data on card #' + slot + '?\nThe old data will be permanently lost.')) return;

      btn.removeAttribute('data-state');
      API.sendWithBtn(btn, API.updateProfile, { 
        profile_index: slot, ssid: ssid, password: pass 
      }, function() {
          wifiNetworks[slot] = ssid;
          statusCard(slot, false);
      });
    }

    function clearCard(slot) {
      if (!confirm('Are you sure you want to delete card #' + slot + 'data?\nThe data will be permanently erased from memory.')) return;

      var btn = document.getElementById('btnClear' + slot);
      btn.removeAttribute('data-state');
      API.sendWithBtn(btn, API.clearProfile, { profile_index: slot }, function() {
        wifiNetworks[slot] = "";
          
        document.getElementById('ssid' + slot).value = "";
        document.getElementById('pass' + slot).value = "";

        statusCard(slot, false);
      });
    }

    function testNetwork(slot) {
      var btn = document.getElementById('btnTest' + slot), a = 0;
      
      btn.removeAttribute('data-state');
      setStatusTestButtons(true, slot);
      
      API.sendWithBtn(btn, API.checkProfile, { profile_index: slot }, function() {
        var i = setInterval(function() {
          API.getResult(function(err, res) {
            if (!err && res && typeof res.result !== 'undefined'&& res.rssi !== 'undefined') {
              clearInterval(i);
              updateStatusTestButton(slot, (res.result === true), res);
            }

            btn.className = btn.className; 
            var width = btn.offsetWidth;
          }, { profile_index: slot });

          a = a + 1;
          if (a > 20) {
            clearInterval(i);
            setStatusTestButtons(false);
            btn.innerText = '⚠️ Timeout';
            btn.setAttribute('data-state', 'error');
          }
        }, 5000);
      });
    }

    /* Web */
    function statusCard(slot, show) {
      var card = document.getElementById('cardTemplate' + slot);
      card.setAttribute('data-state', show ? 'editing' : 'view');

      var ssidInput = document.getElementById('ssid' + slot);
      ssidInput.readOnly = !show;
      ssidInput.value = wifiNetworks[slot] || '';
      document.getElementById('pass' + slot).value = '';

      var children = card.getElementsByTagName('button');
      for (var i = 0; i < children.length; i++) {
        children[i].removeAttribute('data-state');
        children[i].style.backgroundColor = '';
        children[i].style.color = '';
        children[i].disabled = false;
        var originalText = children[i].getAttribute('data-text');
        if (originalText) children[i].innerHTML = originalText;
      }

      document.getElementById('btnHide' + slot).style.backgroundColor = 'gray';
      document.getElementById('btnClear' + slot).style.backgroundColor = 'red';

      card.className = card.className; 
      var width = card.offsetWidth;
    }

    function setStatusTestButtons(start, activeSlot) {
      for (var i = 0; i < countTestButtons; i++) {
        var btn = document.getElementById('btnTest' + i);
        if (btn) {
          btn.disabled = start;
          
          if (!start && i === activeSlot) continue; 

          btn.innerText = start ? '⌛ Wait for another test...' : '📶 Test';
          start ? btn.setAttribute('data-state', 'stop') : btn.removeAttribute('data-state');

          btn.className = btn.className; 
          var w = btn.offsetWidth;
        }
      }
    }

    function updateStatusTestButton(slot, ok, res) {
      var btn = document.getElementById('btnTest' + slot);
      setStatusTestButtons(false, slot);
        
      btn.innerText = (ok ? '✅ OK ' : '❌ FAIL ') + getBars(res.rssi) + ' (RSSI: ' + res.rssi + 'dBm)';
      btn.style.backgroundColor = '';
      btn.style.color = '';
      ok ? btn.removeAttribute('data-state') : btn.setAttribute('data-state', 'error');
    }

    function getBars(d) {
      if (typeof d !== 'number' || d <= -100 || d === 0) return '░░░░';
      if (d <= -85) return '█░░░';
      if (d <= -75) return '██░░';
      if (d <= -65) return '███░';
      return '████';
    }

    /* Load */
    function duplicateCard(slot, ssid, passw) {
      var container = document.getElementById('cards-container');
      var template = document.getElementById('cardTemplate');
      if (!container || !template) return;

      var clone = template.cloneNode(true);

      clone.id = 'cardTemplate' + slot;
      clone.innerHTML = clone.innerHTML.replace(/SLOT_ID/g, slot);
      clone.style.display = 'block';
      clone.setAttribute('data-state', 'view');

      container.appendChild(clone);

      var btns = clone.getElementsByTagName('button');
      for (var i = 0; i < btns.length; i++) {
        btns[i].setAttribute('data-text', btns[i].innerHTML);
      }

      var title = document.getElementById('slotTitle' + slot);
      var ssidInp = document.getElementById('ssid' + slot);
      var passInp = document.getElementById('pass' + slot);

      if (title) title.innerHTML = (slot === 0) ? '🔒 DEFAULT' : '📡 NETWORK ' + slot;
      if (ssidInp) ssidInp.value = ssid || '';
      if (passInp) passInp.value = passw || '';

      if (slot === 0) {
        try { passInp.type = 'text'; } catch(e) {}
        passInp.readOnly = true;
      }
    } 

    window.onload = function() {
      API.getProfiles(function(err, cfg) {
        if (err || !cfg || !cfg.profiles|| typeof cfg.current_profile_index === 'undefined') {
          if (window.console) console.error("Failed to load config:", err);
          return;
        }
        
        try {
          countTestButtons = cfg.profiles.length;
          wifiNetworks.push(cfg.profiles[0].ssid);
          for (var i = 1; i < cfg.profiles.length; i++) {
            wifiNetworks.push(cfg.profiles[i].ssid);
            duplicateCard(i, cfg.profiles[i].ssid);
          }
          
          duplicateCard(0, cfg.profiles[0].ssid, cfg.profiles[0].password);
          
          var slotEl = document.getElementById('slotTitle' + cfg.current_profile_index); 
          slotEl.innerHTML = slotEl.innerHTML + ' (<span style="color:red; font-weight:bold;">USED NOW</span>)';

          if (cfg.rssi_now_profile) updateStatusTestButton(cfg.current_profile_index, true, { rssi: cfg.rssi_now_profile });
        } catch (e) {
          if (window.console) console.error("Initialization error:", e);
        }
      });
    };
  </script>
  <br>
  <div class="window">
    <div class="title">🔒 TLS Settings</div>
    <div class="card">
      <button onclick="updateCert()" id="btnUpdateCert" data-state="error" style="width:100%">🔃 RECREATE TLS SYSTEM</button>
    </div>
  </div>
  <script language="JavaScript">
    API.recreateTLS = function(cb) { API._sendJson("POST", "/_/tls/recreate.do",  null, cb); };

    function updateCert() {
      if (!confirm('Regenerate SSL/TLS keys and certificate?\nCurrent identity will be replaced. Active HTTPS sessions will break.\nYou will need to re-accept the security exception in your browser.')) return;

      var btn = document.getElementById('btnUpdateCert');
      btn.removeAttribute('data-state');
      API.sendWithBtn(btn, API.recreateTLS, null, function() {
        API.reloadWindow(btn);
      });
    }
  </script>
  <div>
    <center>
      <footer>
        <p>© 2026 AmakeSasha, esp_iot_framework. Distributed under a license <a href="/_/files/license.txt">Apache-2.0</a>.</p>
      </footer>
    </center>
  </div>
</body>
</html>
