<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IoT Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <style>
    html, body {
      height:100%;
      margin:0;
      background:#000;
      color:#fff;
      font-family:monospace;
      overflow:hidden;
    }
    .h {
      padding:8px;
      border-bottom:2px solid #fff;
    }
    input {
      background:#000;
      color:#fff;
      border:2px solid #fff;
      padding:10px 15px;
      cursor:pointer;
      margin:6px;
      font-size:18px;
    }
    #f {
      width:100%;
      border:0;
    } 
  </style>
</head>
<body>
  <div class="h" id="h" style="width:100%; overflow:hidden;">
    <div style="float: left;">
      <input type="button" value="MAIN" onclick="location.href='?p=main.html'">
      <input type="button" value="NETWORK" onclick="location.href='?p=network.html'">
      <input type="button" value="SYSTEM" onclick="location.href='?p=system.html'">
    </div>
    <div style="float:right; margin-right:25px;">
      <footer>
        <p>© 2026 AmakeSasha, esp_iot_framework. Distributed under a license <a href="/_/files/license.txt">Apache-2.0</a>.</p>
      </footer>
    </div>
  </div>
  <iframe id="f" frameborder="0" style="background: white;"></iframe>
  <script language="JavaScript">
    function init() {
      var p = "main.html",
          s = window.location.search,
          f = document.getElementById('f'),
          b = document.getElementsByTagName('input');
     
      if (s.indexOf('p=') !== -1) {
        p = s.split('p=')[1].split('&')[0];
      }

      f.src = "/_/files/" + p;

      for (var i = 0; i < b.length; i++) {
        if (b[i].type === 'button') {
          var sel = (b[i].onclick.toString().indexOf(p) !== -1);
          b[i].style.backgroundColor = sel ? '#fff' : '#000';
          b[i].style.color = sel ? '#000' : '#fff';
        }
      }

      window.onresize = function() {
        f.style.height = (document.documentElement.clientHeight - document.getElementById('h').offsetHeight) + 'px';
      };
      window.onresize();
    }
    window.onload = function() {
      init();
    };
  </script>
</body>
</html>
