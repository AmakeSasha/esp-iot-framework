<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>System Setting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="referrer" content="no-referrer">
  <script type="text/javascript" src="/_/files/json2.js"></script>
  <script type="text/javascript" src="/_/files/api.js"></script>
  <link rel="stylesheet" type="text/css" href="/_/files/style.css">
  <style>
    .json-key { color: darkblue; }
    .json-string { color: darkgreen; }
    .json-number { color: purple; }
    .json-boolean { color: red; }
  </style>
</head>
<body>
  <!-- System -->
  <div class="window">
    <div class="title">🔧 System Settings</div>
    <div class="card">
      <button onclick="rebootWeb()" id="rebootBtn" style="width:100%; background:red;">🔃 FORCE SYSTEM REBOOT</button>
    </div>  
    <div class="card">
      <div class="slot" style="margin-bottom:0px;">INFO</div>
      <div class="status-bar" id="jsonOutSYS" style="text-align:left;font-size:16px;background:yellow;color:red;"></div>
    </div>
  </div>
  <script language="JavaScript">
    API.reboot =     function(cb) { API._sendJson("POST", "/_/sys/reboot.do", null, cb); };
    API.getInfoSYS = function(cb) { API._sendJson("GET",  "/_/sys/info.json", null, cb); };

    function rebootWeb() {
      if (!confirm('Are you sure you want to reboot ESP?')) return;

      var btn = document.getElementById('rebootBtn');
      API.sendWithBtn(btn, API.reboot, null, function() {
        API.reloadWindow(btn);
      });
    }

    function loadSYSstatus() {
      var status = document.getElementById('jsonOutSYS');
      API.sendWithBtn(status, API.getInfoSYS, null, function(data) {
        status.innerHTML = '<pre style=\'margin:0;\'>' + formatJson(data) + '</pre>';
      });
    }
  </script>
  <br>
  <!-- OTA -->
  <div class="window">
    <div class="title">📥 OTA Update</div>
    <div class="card">
      <div class="slot">FIRMWARE UPDATE</div>
      <div class="row" id="rowOTAfile" style="display:none;">
        <span class="label">FILE:</span>
        <input type="file" id="OTAfile" accept=".bin">
      </div>
      <button onclick="OTAsend()" id="btnOTAsend" style="display:none;width:100%;background:red;">🚀 FLASH FIRMWARE</button>
      <button onclick="OTAconfBack(true)" id="btnOTAconfirm" style="display:none;width:100%;background:lime;color:red;">✅ Confirm the update</button>
      <div id="brOTAconfBack"><br></div>
      <button onclick="OTAconfBack(false)" id="btnOTArollback" style="display:none;width:100%;background:red;">❌ Roll back the update</button>
    </div>
    <div class="card">
      <div class="slot" style="margin-bottom:0px;">INFO</div>
      <div class="status-bar" id="jsonOutOTA" style="text-align:left;font-size:16px;background:yellow;color:red;"></div>
    </div>
  </div>
  <script language="JavaScript">
    API.uploadOTA =   function(cb, file) { API._sendRaw("POST", "/_/ota/update.do", file, "application/octet-stream", cb); };
    API.getInfoOTA =  function(cb)       { API._sendJson("GET",  "/_/ota/info.json",   null, cb); };
    API.confirmOTA =  function(cb)       { API._sendJson("POST", "/_/ota/confirm.do",  null, cb); };
    API.rollbackOTA = function(cb)       { API._sendJson("POST", "/_/ota/rollback.do", null, cb); };

    function OTAsend() {
      var btn = document.getElementById('btnOTAsend');
      var fileInput = document.getElementById('OTAfile');

      if (!fileInput.files) {
        alert("I'm sorry, I tried my best to make the admin panel fully support your browser.\nHowever, this browser still does not know how to send files via JS... :(\n\nPlease use third-party utilities to send the new firmware.");
        btn.style.backgroundColor = 'grey';
        btn.innerHTML = "I am so sorry...";
        btn.disabled = true;
        return;
      }
      if (fileInput.files.length === 0) {
        alert("Please select a firmware file first!");
        return;
      }

      var file = fileInput.files[0];

      var fileName = file.name.toLowerCase();
      if (fileName.substring(fileName.length - 4) !== '.bin') {
        alert("Invalid file type. Please select a '.bin' firmware file.");
        fileInput.value = '';
        return;
      }

      var msg = 'Are you sure you want to reflash the system?\n\nSTOP. Never trust pre-built binaries from unverified sources. Even "official" files can be compromised, leading to a complete loss of control over your hardware and network.\n\nFor absolute security, audit the source code and compile the firmware on your own machine.\n\nYour hardware, your responsibility! Take care of it!';
      if (!confirm(msg)) return;
      msg = 'Do you want to cancel this action?';
      if (confirm(msg)) return;
      btn.disabled = true;

      API.sendWithBtn(btn, API.uploadOTA, file, function() {
        API.reloadWindow(btn);
      });
    }

    function OTAconfBack(isSuccess) {
      var id = isSuccess ? 'confirm' : 'rollback', 
          altId = isSuccess ? 'rollback' : 'confirm',
          btn = document.getElementById('btnOTA' + id),
          apiFunc = isSuccess ? API.confirmOTA : API.rollbackOTA;

      if (isSuccess) {
        if (!confirm('Are you sure that the firmware is working completely correctly and can be installed as the main one?\n\nSwitching between OTA partitions is not available in this version of the kernel!')) return;
      } else {
        if (!confirm('Confirm firmware rejection?\n\nThis will mark the current version as invalid and forcibly roll back to the previous stable firmware.')) return;
      }
      if (confirm('Do you want to cancel this action?')) return;

      document.getElementById('btnOTA' + altId).style.display = 'none';
      document.getElementById('brOTAconfBack').style.display = 'none';
      API.sendWithBtn(btn, apiFunc, null, function() {
        API.reloadWindow(btn);
      });
    }

    function loadOTAstatus() {
      var status = document.getElementById('jsonOutOTA');
      API.sendWithBtn(status, API.getInfoOTA, null, function(data) {
        status.innerHTML = '<pre style=\'margin:0;\'>' + formatJson(data) + '</pre>';
        var ok = data.ota_status && data.ota_status === "pending_verify";
          
        document.getElementById('btnOTAsend').style.display = ok ? 'none' : 'block';
        document.getElementById('rowOTAfile').style.display = ok ? 'none' : 'block';
        document.getElementById('brOTAconfBack').style.display = ok ? 'block' : 'none';
        document.getElementById('btnOTAconfirm').style.display = ok ? 'block' : 'none';
        document.getElementById('btnOTArollback').style.display = ok ? 'block' : 'none';
      });
    }
  </script>
  <br>
  <!-- Admin password-->
  <div class="window">
    <div class="title">🔐 Admin Password</div>
    <!-- Edit Admin Password-->
    <div class="card">
      <button onclick="toggleAdminForm()" id="btnShowEditAdminPass" style="width:100%">🔃 Change Admin Password</button>
      <div id="adminFormFields">
        <div class="row">
          <span class="label">Password:</span>
          <input type="password" id="newAdminPassI1" maxlength="63" onkeyup="validateAdminPass()" oninput="validateAdminPass()"onchange="validateAdminPass()" autocomplete="new-password">
        </div>
        <div class="row">
          <span class="label">Confirm:</span>
          <input type="password" id="newAdminPassI2" maxlength="63" onkeyup="validateAdminPass()" oninput="validateAdminPass()" onchange="validateAdminPass()" autocomplete="new-password">
        </div>
        <div id="adminMsg" style="background:yellow; padding:5px; margin-bottom:10px; text-align:center; color:green;">Enter 8+ characters</div>
        <button onclick="updateAdminPass()" id="btnSaveAdminPass" disabled style="width:100%; height:30px; background:red;">🔒 Save Changes</button>
      </div>
    </div>
  </div>
  <script language="JavaScript">
    API.updatePass = function(cb, d) { API._sendJson("POST", "/_/apass/update.do", d, cb); };

    function toggleAdminForm() {
      var f = document.getElementById('adminFormFields'),
          b = document.getElementById('btnShowEditAdminPass'),
          show = f.style.display === 'none',
          btn = document.getElementById('btnSaveAdminPass');

      if (btn) {
        btn.disabled = false;
        btn.style.backgroundColor = 'red';
        btn.style.color = 'yellow';
      }

      f.style.display = show ? 'block' : 'none';
      b.style.backgroundColor = show ? 'gray' : 'red';
      b.innerHTML = show ? "❌ Cancel" : "🔃 Change Admin Password";

      if (!show) {
        document.getElementById('newAdminPassI1').value = document.getElementById('newAdminPassI2').value = "";
        validateAdminPass();
      }
    }

    function validateAdminPass() {
      var p1 = document.getElementById('newAdminPassI1').value,
        p2 = document.getElementById('newAdminPassI2').value,
        msg = document.getElementById('adminMsg'),
        btn = document.getElementById('btnSaveAdminPass'),
        isEmpty = !p1 && !p2,
        isShort = p1.length < 8 || p2.length < 8,
        isMatch = p1 === p2,
        ok = isEmpty || (!isShort && isMatch);

      msg.innerHTML = isEmpty ? "Enter new password or Clear" : (isShort ? "Too short (min 8)" : (isMatch ? "Passwords match!" : "Passwords do not match"));
      msg.style.color = isEmpty ? "gray" : (ok ? "green" : "red");

      btn.innerHTML = isEmpty ? "🧹 Clear" : "💾 Save";
      btn.style.display = ok ? 'block' : 'none';
      btn.disabled = !ok;
    }

    function updateAdminPass() {
      var pass = document.getElementById('newAdminPassI1').value;
      var btn = document.getElementById('btnSaveAdminPass');

      var msg = "";
      if (pass.length == 0) {
        msg = "Are you sure you want to remove the 'Admin Password'?\nAnyone will be able to access the IoT Menu and its API using only the 'Admin' login.\nThey could also change the password without your knowledge, and you will permanently lose access.";
      } else {
        msg = "Are you sure you want to change the 'Admin Password'?\nIf the password is lost, you will lose access to the 'IoT Menu' and its API.\nTo restore access, you will need to reflash the microcontroller or manually read the NVS memory.";
      }
      if (!confirm(msg)) return;

      API.sendWithBtn(btn, API.updatePass, { password: pass }, function() {
        btn.innerHTML = "✅ Password Updated!";
        btn.style.backgroundColor = "green";
        btn.style.color = "yellow";
        btn.disabled = true;
        setTimeout(toggleAdminForm, 15000);
      });
    }
  </script>
  <!-- Other -->
  <script language="JavaScript">
    function formatJson(json) {
      var res = JSON.stringify(json, null, 2);

      res = res.replace(/("(\\.|[^"\\])*")/g, function(match) {
          return '<span class="json-string">' + match + '</span>';
      });
      res = res.replace(/\b\d+\b/g, function(match, offset, fullString) {
        var part = fullString.substring(0, offset);
        if (part.lastIndexOf('<span class="json-string">') > part.lastIndexOf('</span>')) return match;
        return '<span class="json-number">' + match + '</span>';
      });
      res = res.replace(/\b(true|false|null)\b/g, function(match, word, offset, fullString) {
        var part = fullString.substring(0, offset);
        if (part.lastIndexOf('<span class="json-string">') > part.lastIndexOf('</span>')) return match;
        return '<span class="json-boolean">' + match + '</span>';
      });
      res = res.replace(/<span class="json-string">("[^"]+")<\/span>\s*:/g, '<span class="json-key">$1</span>:');
      
      return res;
    }

    window.onload = function() {
      setTimeout(toggleAdminForm, 50);
      setTimeout(loadSYSstatus, 50);
      setTimeout(loadOTAstatus, 50);
    };
  </script>
  <div>
    <center>
      <footer>
        <p>© 2026 AmakeSasha, esp_iot_framework. Distributed under a license <a href="/_/files/license.txt">Apache-2.0</a>.</p>
      </footer>
    </center>
  </div>
</body>
</html>
