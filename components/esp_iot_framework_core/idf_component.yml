name: "esp_iot_framework_core"
description: "A meta-framework for building reliable, node-based IoT frameworks on Espressif Systems devices"
version: "0.2.1"
license: "Apache-2.0"
targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c6
dependencies:
  idf: ">=4.4.0"
  espressif/mdns:
    version: "^1.0.0"
    rules:
      - if: "idf_version >= 5.0.0"