branch_protection:
  policies:
    - target: default_branch
      message: "Force push and deletion of the default branch are prohibited. Regular pushes are allowed."
      rules:
        - prevent_force_push
        - prevent_deletion

    - target: branch
      matches: ["**", "!feature/**", "!bugfix/**", "!hotfix/**", "!chore/**", "!docs/**", "!refactor/**", "!release/**"]
      message: "Invalid branch name. Allowed prefixes: feature/, bugfix/, hotfix/, chore/, docs/, refactor/, release/"
      rules:
        - prevent_creation
