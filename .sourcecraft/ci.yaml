on:
  push:
    - workflows: [test_build_v4_4, test_build_v5_5]
      filter:
        tags: ["**"]

workflows:
  test_build_v4_4:
    tasks:
      - name: build_xtensa
        cubes:
          - name: esp32
            image: espressif/idf:v4.4
            script: ["cd examples/hello_world && idf.py set-target esp32 && idf.py build"]
          - name: esp32s3_cpp_xtensa
            image: espressif/idf:v4.4
            script: ["cd examples/hello_world_cpp && idf.py set-target esp32s3 && idf.py build"]
          - name: esp32s2
            image: espressif/idf:v4.4
            script: ["cd examples/hello_world && idf.py set-target esp32s2 && idf.py build"]

      - name: build_riscv
        cubes:
          - name: esp32c3
            image: espressif/idf:v4.4
            script: ["cd examples/hello_world && idf.py set-target esp32c3 && idf.py build"]
          - name: esp32c3_cpp_riscv
            image: espressif/idf:v4.4
            script: ["cd examples/hello_world_cpp && idf.py set-target esp32c3 && idf.py build"]

  test_build_v5_5:
    tasks:
      - name: build_xtensa
        cubes:
          - name: esp32
            image: espressif/idf:v5.5
            script: ["cd examples/hello_world && idf.py set-target esp32 && idf.py build"]
          - name: esp32s2_cpp_xtensa
            image: espressif/idf:v5.5
            script: ["cd examples/hello_world_cpp && idf.py set-target esp32s2 && idf.py build"]
          - name: esp32s3
            image: espressif/idf:v5.5
            script: ["cd examples/hello_world && idf.py set-target esp32s3 && idf.py build"]

      - name: build_riscv
        cubes:
          - name: esp32c6
            image: espressif/idf:v5.5
            script: ["cd examples/hello_world && idf.py set-target esp32c6 && idf.py build"]
          - name: esp32c3_cpp_riscv
            image: espressif/idf:v5.5
            script: ["cd examples/hello_world_cpp && idf.py set-target esp32c3 && idf.py build"]
          - name: esp32c2
            image: espressif/idf:v5.5
            script: ["cd examples/hello_world && idf.py set-target esp32c2 && idf.py build"]