on:
  pull_request:
    - workflows: [test_build]
      filter:
        target_branches: ["main"]
        paths: ["examples/**", "include/**", "src/**", "CMakeLists.txt", "sdkconfig.defaults"]
  push:
    - workflows: [test_build]
      filter:
        branches: ["main"]
    - workflows: [test_build]
      filter:
        tags: ["v*"]

workflows:
  test_build:
    tasks:
      - name: build_esp32
        cubes:
          - name: idf
            image: espressif/idf:release-v4.4.6
            script:
              - cd examples/hello_world
              - idf.py set-target esp32
              - idf.py build

      - name: build_esp32s3
        cubes:
          - name: idf
            image: espressif/idf:release-v4.4.6
            script:
              - cd examples/hello_world
              - idf.py set-target esp32s3
              - idf.py build

      - name: build_esp32c3
        cubes:
          - name: idf
            image: espressif/idf:release-v4.4.6
            script:
              - cd examples/hello_world
              - idf.py set-target esp32c3
              - idf.py build

      - name: build_esp32c6
        cubes:
          - name: idf
            image: espressif/idf:release-v5.1
            script:
              - cd examples/hello_world && idf.py set-target esp32c6 && idf.py build || true

      - name: build_s3_cpp
        cubes:
          - name: idf
            image: espressif/idf:release-v4.4.6
            script:
              - cd examples/hello_world_cpp && idf.py set-target esp32s3 && idf.py build || true
