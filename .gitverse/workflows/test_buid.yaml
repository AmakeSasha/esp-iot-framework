name: test_build

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: esp32,   image: "dockerhub.timeweb.cloud/espressif/idf:v4.4.6", dir: "hello_world" }
          - { target: esp32s2,  image: "dockerhub.timeweb.cloud/espressif/idf:v4.4.6", dir: "hello_world" }
          - { target: esp32s3,  image: "dockerhub.timeweb.cloud/espressif/idf:v4.4.6", dir: "hello_world" }
          - { target: esp32c3,  image: "dockerhub.timeweb.cloud/espressif/idf:v4.4.6", dir: "hello_world" }
          - { target: esp32c6,  image: "dockerhub.timeweb.cloud/espressif/idf:v5.1",   dir: "hello_world" }
          - { target: esp32s3,  image: "dockerhub.timeweb.cloud/espressif/idf:v4.4.6", dir: "hello_world_cpp" }
          - { target: esp32c3,  image: "dockerhub.timeweb.cloud/espressif/idf:v5.1",   dir: "hello_world_cpp" }

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Fetch code
        run: |
          git clone --depth 1 https://gitverse.ru/amakesasha/esp-iot-framework .
      
      - name: Build
        run: |
          . $IDF_PATH/export.sh
          cd examples/${{ matrix.dir }}
          idf.py set-target ${{ matrix.target }}
          idf.py build