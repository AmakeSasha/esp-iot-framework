name: test_build

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build_legacy:
    runs-on: ubuntu-latest
    container: espressif/idf:v4.4.6
    steps:
      - name: build
        run: |
          git clone --depth 1 https://gitverse.ru/amakesasha/esp-iot-framework .
          . $IDF_PATH/export.sh
          cd examples/hello_world
          idf.py set-target esp32 && idf.py build
          idf.py set-target esp32s2 && idf.py build
          idf.py set-target esp32s3 && idf.py build
          idf.py set-target esp32c3 && idf.py build
          cd ../hello_world_cpp
          idf.py set-target esp32s3 && idf.py build

  build_modern:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.1
    steps:
      - name: build
        run: |
          git clone --depth 1 https://gitverse.ru/amakesasha/esp-iot-framework .
          . $IDF_PATH/export.sh
          cd examples/hello_world
          idf.py set-target esp32c6 && idf.py build
          cd ../hello_world_cpp
          idf.py set-target esp32c3 && idf.py build
