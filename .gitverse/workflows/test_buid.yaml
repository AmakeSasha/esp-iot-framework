name: test_build

on:
  push:
    tags: ["v*"]

jobs:
  build_xtensa:
    runs-on: ubuntu-latest
    container: espressif/idf:v4.4.6
    steps:
      - name: build tasks
        run: |
          git clone --depth 1 --branch ${{ github.ref_name }} https://gitverse.ru{{ github.repository }}.git .
          . $IDF_PATH/export.sh
          cd examples/hello_world && idf.py set-target esp32 && idf.py build
          cd /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
          cd examples/hello_world && idf.py set-target esp32s2 && idf.py build
          cd /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
          cd examples/hello_world && idf.py set-target esp32s3 && idf.py build

  build_riscv:
    runs-on: ubuntu-latest
    steps:
      - name: esp32c3
        uses: docker://espressif/idf:v4.4.6
        run: |
          git clone --depth 1 --branch ${{ github.ref_name }} https://gitverse.ru{{ github.repository }}.git .
          . $IDF_PATH/export.sh
          cd examples/hello_world && idf.py set-target esp32c3 && idf.py build
      - name: esp32c6
        uses: docker://espressif/idf:v5.1
        run: |
          . $IDF_PATH/export.sh
          cd examples/hello_world && idf.py set-target esp32c6 && idf.py build

  build_cpp_tests:
    runs-on: ubuntu-latest
    steps:
      - name: s3_cpp_xtensa
        uses: docker://espressif/idf:v4.4.6
        run: |
          git clone --depth 1 --branch ${{ github.ref_name }} https://gitverse.ru{{ github.repository }}.git .
          . $IDF_PATH/export.sh
          cd examples/hello_world_cpp && idf.py set-target esp32s3 && idf.py build
      - name: c3_cpp_riscv
        uses: docker://espressif/idf:v5.1
        run: |
          . $IDF_PATH/export.sh
          cd examples/hello_world_cpp && idf.py set-target esp32c3 && idf.py build
