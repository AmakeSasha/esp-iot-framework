name: Test Build

on:
  push:
    tags: ["**"]
  workflow_dispatch: {}

jobs:
  test_build_v4_4:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: esp32,   dir: "hello_world_server" }
          - { target: esp32s3, dir: "hello_world_cpp_server" }
          - { target: esp32s2, dir: "hello_world_server" }
          - { target: esp32c3, dir: "hello_world_server" }
          - { target: esp32c3, dir: "hello_world_cpp_server" }
    container:
      image: espressif/idf:release-v4.4
    steps:
      - name: Fetch code
        run: |
          git clone --depth 1 https://github.com/amakesasha/esp-iot-framework .
      - name: Build
        run: |
          . $IDF_PATH/export.sh
          cd examples/${{ matrix.dir }}
          idf.py set-target ${{ matrix.target }}
          idf.py build

  test_build_v5_5:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: esp32,   dir: "hello_world" }
          - { target: esp32s2, dir: "hello_world_cpp" }
          - { target: esp32s3, dir: "hello_world" }
          - { target: esp32c6, dir: "hello_world" }
          - { target: esp32c3, dir: "hello_world_cpp" }
          - { target: esp32c2, dir: "hello_world" }
    container:
      image: espressif/idf:v5.5
    steps:
      - name: Fetch code
        run: |
          git clone --depth 1 https://github.com/amakesasha/esp-iot-framework .
      - name: Build
        run: |
          . $IDF_PATH/export.sh
          cd examples/${{ matrix.dir }}
          idf.py set-target ${{ matrix.target }}
          idf.py build