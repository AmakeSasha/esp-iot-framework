name: Test Build

on:
  push:
    tags: ["**"]
  workflow_dispatch: {}

jobs:
  test_build_v4_4:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: esp32, dir: "hello_world" }
          - { target: esp32s3, dir: "hello_world_cpp" }
          - { target: esp32s2, dir: "hello_world" }
          - { target: esp32c3, dir: "hello_world" }
          - { target: esp32c3, dir: "hello_world_cpp" }

    container:
      image: espressif/idf:release-v4.4

    steps:
      - name: Fetch code
        run: |
          git clone --depth 1 "https://${{ secrets.SYNC_MIRROR_URL }}" .

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: idf-v4.4-${{ matrix.target }}-${{ matrix.dir }}-${{ github.sha }}
          restore-keys: |
            idf-v4.4-${{ matrix.target }}-${{ matrix.dir }}-

      - name: Build
        run: |
          . $IDF_PATH/export.sh
          export IDF_CCACHE_ENABLE=1
          cd examples/${{ matrix.dir }}
          idf.py fullclean
          idf.py set-target ${{ matrix.target }}
          idf.py build

  test_build_v5_5:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: esp32, dir: "hello_world" }
          - { target: esp32s2, dir: "hello_world_cpp" }
          - { target: esp32s3, dir: "hello_world" }
          - { target: esp32c6, dir: "hello_world" }
          - { target: esp32c3, dir: "hello_world_cpp" }
          - { target: esp32c2, dir: "hello_world" }

    container:
      image: espressif/idf:v5.5

    steps:
      - name: Fetch code
        run: |
          git clone --depth 1 "https://${{ secrets.SYNC_MIRROR_URL }}" .

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: idf-v5.5-${{ matrix.target }}-${{ matrix.dir }}-${{ github.sha }}
          restore-keys: |
            idf-v5.5-${{ matrix.target }}-${{ matrix.dir }}-

      - name: Build
        run: |
          . $IDF_PATH/export.sh
          export IDF_CCACHE_ENABLE=1
          cd examples/${{ matrix.dir }}
          idf.py fullclean
          idf.py set-target ${{ matrix.target }}
          idf.py build