name: Sync code

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run Git Sync
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git config --global http.postBuffer 524288000
          git clone --mirror "https://git.sourcecraft.dev/amakesasha/esp-iot-framework.git" repo
          cd repo
          git push "https://oauth2:${{ secrets.SYNC_GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" +refs/*:refs/*