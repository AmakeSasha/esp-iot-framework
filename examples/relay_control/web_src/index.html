<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
  <meta charset="UTF-8">
  <title>Relay Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="referrer" content="no-referrer">
  <style>
    body {
      background-color: #d4d0c8;
      font-family: "MS Sans Serif", Geneva, sans-serif;
      font-size: 12px;
      color: #000000;
      margin: 20px;
    }
    .panel {
      background-color: #d4d0c8;
      border: 2px solid;
      border-color: #fff #808080 #808080 #fff;
      padding: 15px;
      width: 180px;
    }
    .panel-title {
      font-weight: bold;
      margin-bottom: 10px;
      border-bottom: 1px solid #808080;
      padding-bottom: 3px;
    }
    .ctrl-btn {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 12px 0;
      font-family: "MS Sans Serif", sans-serif;
      font-size: 11px;
      background-color: #d4d0c8;
      border: 1px solid;
      border-color: #fff #555 #555 #fff;
      cursor: pointer;
    }
    .status-box {
      background-color: #ffffff;
      border: 1px solid;
      border-color: #808080 #808080 #fff #fff;
      padding: 3px;
      font-family: monospace;
      font-size: 11px;
      margin-top: 10px;
      text-align: left;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="panel-title">RELAY REMOTE</div>

    <button id="onBtn" class="ctrl-btn" onclick="relay('on')">TURN ON</button>
    <button id="offBtn" class="ctrl-btn" onclick="relay('off')">TURN OFF</button>
    <button id="toggleBtn" class="ctrl-btn" style="font-weight: bold;" onclick="relayToggle()">TOGGLE STATE</button>

    <pre class="status-box" id="statusLabel">EMPTY</pre>

    <button id="toggleBtn" class="ctrl-btn" style="background-color: red; font-weight: bold;" onclick="relayToggleLogic()">TOGGLE LOGIC</button>
  </div>

  <script>
    function sendHttpRequest(method, targetUrl, callback) {
      var xmlhttp = window.XMLHttpRequest ? new XMLHttpRequest() : new ActiveXObject("Microsoft.XMLHTTP");

      if (callback) {
        xmlhttp.onreadystatechange = function() {
          if (xmlhttp.readyState === 4) {
            callback(xmlhttp);
          }
        };
      }

      xmlhttp.open(method, targetUrl + "?t=" + new Date().getTime(), true);
      xmlhttp.send();
    }

    function relay(state) {
      sendHttpRequest("POST", "/api/relay/" + state + ".do");
    }

    function relayToggle() {
      sendHttpRequest("POST", "/api/relay/toggle.do");
    }

    function relayToggleLogic() {
      sendHttpRequest("POST", "/api/relay/toggle_logic.do");
    }

    function checkRelayStatus() {
      sendHttpRequest("GET", "/api/relay/status.json", function(xmlhttp) {
        if (xmlhttp.status === 200) {
          try {
            var data = JSON.parse(xmlhttp.responseText);
            document.getElementById("statusLabel").textContent = JSON.stringify(data, null, 2);
          } catch (e) {
            document.getElementById("statusLabel").innerHTML = "JSON_PARSE_ERROR";
          }
        } else {
          document.getElementById("statusLabel").innerHTML = "SERVER_ERROR: " + xmlhttp.status;
        }
      });
    }

    window.onload = function() {
      checkRelayStatus();
      setInterval(checkRelayStatus, 500);
    };
  </script>
</body>
</html>
